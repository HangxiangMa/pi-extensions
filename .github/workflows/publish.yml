name: Version or publish packages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: changesets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create version PR or publish packages
    runs-on: ubuntu-latest

    steps:
      - name: Check out source revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Set up repository-pinned npm
        run: |
          set -euo pipefail
          package_manager="$(node -p 'require("./package.json").packageManager')"
          [[ "$package_manager" == npm@* ]]
          npm install --global "$package_manager"
          test "$(npm --version)" = "${package_manager#npm@}"

      - name: Install dependencies
        run: npm ci

      - name: Validate packages
        run: npm run check

      - name: Create version pull request or publish to npm
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          version: npm run version-packages
          publish: npm run publish-packages
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
          createGithubReleases: true
          commitMode: github-api
        env:
          NPM_CONFIG_PROVENANCE: "true"
