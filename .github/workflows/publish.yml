name: Version or publish packages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: changesets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create version PR or publish packages
    runs-on: ubuntu-latest

    steps:
      - name: Check out source revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate packages
        run: npm run check

      - name: Create version pull request or publish to npm
        id: changesets
        uses: changesets/action@22ccf9aa43179fe9e27dc62e575971d28cce197c # v2.0.0
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          version: npm run version-packages
          publish: npm run publish-packages
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
          createGithubReleases: true
          commitMode: github-api
        env:
          NPM_CONFIG_PROVENANCE: "true"
